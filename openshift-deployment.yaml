# OpenShift: Deployment + Service + Route (image quay.io/rabraham/rhel-httpd:v1.2, port 8080).
# Apply: oc apply -f openshift-deployment.yaml -n <project>
# URL:  oc get route my-webserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-webserver
  labels:
    app: my-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-webserver
  template:
    metadata:
      labels:
        app: my-webserver
    spec:
      containers:
        - name: my-webserver
          image: quay.io/rabraham/rhel-httpd:v1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: my-webserver
  labels:
    app: my-webserver
spec:
  type: ClusterIP
  selector:
    app: my-webserver
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: my-webserver
  labels:
    app: my-webserver
spec:
  to:
    kind: Service
    name: my-webserver
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
